<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:var(--neutral-1000);margin:0;padding:0;overflow:hidden}
  body{width:700px;padding:24px;font-family:var(--font-ui);color:var(--fg-primary)}
  .row{display:flex;gap:12px;align-items:stretch}
  .col{display:flex;flex-direction:column;gap:8px;flex:1}
  .lbl{font:500 11px/1 var(--font-ui);color:var(--fg-muted);letter-spacing:.04em;text-transform:uppercase}
  .hex{font:500 11px/1 var(--font-data);color:var(--fg-muted);font-variant-numeric:tabular-nums}
  .name{font:500 13px/1 var(--font-ui);color:var(--fg-primary)}
  .swatch{height:64px;border-radius:6px;border:1px solid rgba(255,255,255,.04)}
  .chip{display:flex;flex-direction:column;gap:6px;flex:1}
  .meta{display:flex;justify-content:space-between;align-items:baseline}
  .grid-bg{background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:8px 8px}
</style>
</head>
<body>
<div style="background:var(--bg-card);border:1px solid var(--border-default);border-radius:10px;padding:14px">
  <div style="height:6px;background:var(--neutral-900);border-radius:3px;position:relative;margin-bottom:14px">
    <div style="position:absolute;left:0;top:0;height:6px;width:51%;background:var(--ember-500);border-radius:3px"></div>
    <div style="position:absolute;left:51%;top:-5px;width:16px;height:16px;background:var(--ember-500);border-radius:50%;transform:translateX(-50%);box-shadow:0 0 0 3px var(--bg-card),0 0 0 4px var(--ember-500)"></div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="btn-primary" style="width:72px">▶ Play</button>
    <button class="btn-secondary" style="width:36px;font-family:var(--font-data)">&lt;</button>
    <button class="btn-secondary" style="width:36px;font-family:var(--font-data)">&gt;</button>
    <div style="flex:1"></div>
    <span style="font-family:var(--font-data);font-size:13px;color:var(--status-warn);font-variant-numeric:tabular-nums">Status: frame 8854/17318 | ROI: (3, 7, 1020, 373) | thresh: 300.0C</span>
  </div>
</div>
<div style="margin-top:8px;font:400 11px var(--font-ui);color:var(--fg-muted)">Bottom control pod — always pinned, full width. Slider row above transport + status row.</div></body></html>
