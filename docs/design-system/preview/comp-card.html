<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:var(--neutral-1000);margin:0;padding:0;overflow:hidden}
  body{width:700px;padding:24px;font-family:var(--font-ui);color:var(--fg-primary)}
  .row{display:flex;gap:12px;align-items:stretch}
  .col{display:flex;flex-direction:column;gap:8px;flex:1}
  .lbl{font:500 11px/1 var(--font-ui);color:var(--fg-muted);letter-spacing:.04em;text-transform:uppercase}
  .hex{font:500 11px/1 var(--font-data);color:var(--fg-muted);font-variant-numeric:tabular-nums}
  .name{font:500 13px/1 var(--font-ui);color:var(--fg-primary)}
  .swatch{height:64px;border-radius:6px;border:1px solid rgba(255,255,255,.04)}
  .chip{display:flex;flex-direction:column;gap:6px;flex:1}
  .meta{display:flex;justify-content:space-between;align-items:baseline}
  .grid-bg{background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:8px 8px}
</style>
</head>
<body>
<div style="background:var(--bg-card);border:1px solid var(--border-default);border-radius:10px;padding:14px;width:300px">
  <div style="font:600 14px var(--font-ui);color:var(--ember-500);letter-spacing:.02em;margin-bottom:10px">Parameters</div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <div style="font-size:13px;color:var(--fg-secondary)">Detect Thresh:</div>
    <input class="input" value="300.0" style="width:80px;text-align:right;height:28px">
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <div style="font-size:13px;color:var(--fg-secondary)">Emissivity:</div>
    <div style="display:flex;gap:8px;align-items:center">
      <span style="font:500 11px var(--font-data);color:var(--fg-muted)">0.940</span>
      <input class="input" value="0.940" style="width:64px;text-align:right;height:28px">
    </div>
  </div>
  <div style="display:flex;gap:8px;margin-top:14px">
    <button class="btn-secondary" style="flex:1;font-size:12px;height:28px">Apply File</button>
    <button class="btn-secondary" style="flex:1;font-size:12px;height:28px">Apply All</button>
  </div>
</div>
<div style="margin-top:10px;font:400 11px var(--font-ui);color:var(--fg-muted);max-width:300px">Standard side-panel pod: 10px radius, 1px hairline border, ember section header. No drop shadow.</div></body></html>
