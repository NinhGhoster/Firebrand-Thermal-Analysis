<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:var(--neutral-1000);margin:0;padding:0;overflow:hidden}
  body{width:700px;padding:24px;font-family:var(--font-ui);color:var(--fg-primary)}
  .row{display:flex;gap:12px;align-items:stretch}
  .col{display:flex;flex-direction:column;gap:8px;flex:1}
  .lbl{font:500 11px/1 var(--font-ui);color:var(--fg-muted);letter-spacing:.04em;text-transform:uppercase}
  .hex{font:500 11px/1 var(--font-data);color:var(--fg-muted);font-variant-numeric:tabular-nums}
  .name{font:500 13px/1 var(--font-ui);color:var(--fg-primary)}
  .swatch{height:64px;border-radius:6px;border:1px solid rgba(255,255,255,.04)}
  .chip{display:flex;flex-direction:column;gap:6px;flex:1}
  .meta{display:flex;justify-content:space-between;align-items:baseline}
  .grid-bg{background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:8px 8px}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:14px">
  <div style="background:var(--bg-card);border:1px solid var(--border-default);border-radius:8px;padding:14px 16px">
    <div style="font:600 13px var(--font-ui);color:var(--fg-primary);margin-bottom:6px">--ease-instrument</div>
    <div style="font:400 11px var(--font-data);color:var(--fg-muted)">cubic-bezier(0.32, 0.72, 0, 1)</div>
    <div style="font:400 11px var(--font-ui);color:var(--fg-muted);margin-top:6px">Sharp out, slow finish. Single curve for the whole system. No bounces, no springs.</div>
  </div>
  <div style="display:flex;gap:10px">

    <div style="flex:1;background:var(--bg-card);border:1px solid var(--border-default);border-radius:8px;padding:10px 14px">
      <div style="font:500 11px var(--font-data);color:var(--fg-muted)">--duration-micro</div>
      <div style="font:600 18px var(--font-data);color:var(--ember-500);margin-top:2px">120ms</div>
      <div style="font:400 10px var(--font-ui);color:var(--fg-muted);margin-top:4px">hover · focus</div>
    </div>
    <div style="flex:1;background:var(--bg-card);border:1px solid var(--border-default);border-radius:8px;padding:10px 14px">
      <div style="font:500 11px var(--font-data);color:var(--fg-muted)">--duration-small</div>
      <div style="font:600 18px var(--font-data);color:var(--ember-500);margin-top:2px">200ms</div>
      <div style="font:400 10px var(--font-ui);color:var(--fg-muted);margin-top:4px">panels · tooltips</div>
    </div>
    <div style="flex:1;background:var(--bg-card);border:1px solid var(--border-default);border-radius:8px;padding:10px 14px">
      <div style="font:500 11px var(--font-data);color:var(--fg-muted)">--duration-layout</div>
      <div style="font:600 18px var(--font-data);color:var(--ember-500);margin-top:2px">320ms</div>
      <div style="font:400 10px var(--font-ui);color:var(--fg-muted);margin-top:4px">layout shifts</div>
    </div>
  </div>
</div></body></html>
