<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:var(--neutral-1000);margin:0;padding:0;overflow:hidden}
  body{width:700px;padding:24px;font-family:var(--font-ui);color:var(--fg-primary)}
  .row{display:flex;gap:12px;align-items:stretch}
  .col{display:flex;flex-direction:column;gap:8px;flex:1}
  .lbl{font:500 11px/1 var(--font-ui);color:var(--fg-muted);letter-spacing:.04em;text-transform:uppercase}
  .hex{font:500 11px/1 var(--font-data);color:var(--fg-muted);font-variant-numeric:tabular-nums}
  .name{font:500 13px/1 var(--font-ui);color:var(--fg-primary)}
  .swatch{height:64px;border-radius:6px;border:1px solid rgba(255,255,255,.04)}
  .chip{display:flex;flex-direction:column;gap:6px;flex:1}
  .meta{display:flex;justify-content:space-between;align-items:baseline}
  .grid-bg{background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:8px 8px}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:12px">
  <div style="display:flex;gap:8px;align-items:center">
    <button class="btn-primary">Open File/Folder</button>
    <button class="btn-primary" style="background:var(--ember-400)">Hover</button>
    <button class="btn-primary" style="background:var(--ember-600);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)">Pressed</button>
    <button class="btn-primary" style="opacity:.4;cursor:not-allowed">Disabled</button>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="btn-secondary">Reset Zoom</button>
    <button class="btn-secondary" style="background:var(--neutral-600)">Hover</button>
    <button class="btn-secondary" style="background:var(--bg-pressed)">Pressed</button>
    <button class="btn-secondary" style="opacity:.4;cursor:not-allowed">Disabled</button>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="btn-primary" style="height:40px;padding:0 20px;font-weight:600">Export Actions...</button>
    <button class="btn-secondary" style="height:28px;padding:0 10px;font-size:12px">Set Start</button>
    <button class="btn-secondary" style="width:32px;padding:0;font-family:var(--font-data)">&lt;</button>
    <button class="btn-secondary" style="width:32px;padding:0;font-family:var(--font-data)">&gt;</button>
  </div>
</div></body></html>
