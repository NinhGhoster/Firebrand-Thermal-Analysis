<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:var(--neutral-1000);margin:0;padding:0;overflow:hidden}
  body{width:700px;padding:24px;font-family:var(--font-ui);color:var(--fg-primary)}
  .row{display:flex;gap:12px;align-items:stretch}
  .col{display:flex;flex-direction:column;gap:8px;flex:1}
  .lbl{font:500 11px/1 var(--font-ui);color:var(--fg-muted);letter-spacing:.04em;text-transform:uppercase}
  .hex{font:500 11px/1 var(--font-data);color:var(--fg-muted);font-variant-numeric:tabular-nums}
  .name{font:500 13px/1 var(--font-ui);color:var(--fg-primary)}
  .swatch{height:64px;border-radius:6px;border:1px solid rgba(255,255,255,.04)}
  .chip{display:flex;flex-direction:column;gap:6px;flex:1}
  .meta{display:flex;justify-content:space-between;align-items:baseline}
  .grid-bg{background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:8px 8px}
</style>
</head>
<body>
<div class="row" style="gap:6px">

  <div class="chip">
    <div class="swatch" style="background:#FFE9D6;"></div>
    <div class="meta" style="flex-direction:column;align-items:flex-start;gap:2px">
      <div class="name" style="font-size:11px">100</div>
      <div class="hex">#FFE9D6</div>
    </div>
  </div>
  <div class="chip">
    <div class="swatch" style="background:#FFCFA0;"></div>
    <div class="meta" style="flex-direction:column;align-items:flex-start;gap:2px">
      <div class="name" style="font-size:11px">200</div>
      <div class="hex">#FFCFA0</div>
    </div>
  </div>
  <div class="chip">
    <div class="swatch" style="background:#FFB347;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)"></div>
    <div class="meta" style="flex-direction:column;align-items:flex-start;gap:2px">
      <div class="name" style="font-size:11px">300 · <span style="color:var(--ember-300);text-transform:lowercase">hover</span></div>
      <div class="hex">#FFB347</div>
    </div>
  </div>
  <div class="chip">
    <div class="swatch" style="background:#FF8A2B;"></div>
    <div class="meta" style="flex-direction:column;align-items:flex-start;gap:2px">
      <div class="name" style="font-size:11px">400</div>
      <div class="hex">#FF8A2B</div>
    </div>
  </div>
  <div class="chip">
    <div class="swatch" style="background:#FF6B1A;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)"></div>
    <div class="meta" style="flex-direction:column;align-items:flex-start;gap:2px">
      <div class="name" style="font-size:11px">500 · <span style="color:var(--ember-300);text-transform:lowercase">primary</span></div>
      <div class="hex">#FF6B1A</div>
    </div>
  </div>
  <div class="chip">
    <div class="swatch" style="background:#E5520A;"></div>
    <div class="meta" style="flex-direction:column;align-items:flex-start;gap:2px">
      <div class="name" style="font-size:11px">600</div>
      <div class="hex">#E5520A</div>
    </div>
  </div>
  <div class="chip">
    <div class="swatch" style="background:#B83C00;"></div>
    <div class="meta" style="flex-direction:column;align-items:flex-start;gap:2px">
      <div class="name" style="font-size:11px">700</div>
      <div class="hex">#B83C00</div>
    </div>
  </div>
  <div class="chip">
    <div class="swatch" style="background:#7A2700;"></div>
    <div class="meta" style="flex-direction:column;align-items:flex-start;gap:2px">
      <div class="name" style="font-size:11px">800</div>
      <div class="hex">#7A2700</div>
    </div>
  </div>
  <div class="chip">
    <div class="swatch" style="background:#3F1500;"></div>
    <div class="meta" style="flex-direction:column;align-items:flex-start;gap:2px">
      <div class="name" style="font-size:11px">900</div>
      <div class="hex">#3F1500</div>
    </div>
  </div>
</div></body></html>
