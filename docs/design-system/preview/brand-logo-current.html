<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:var(--neutral-1000);margin:0;padding:0;overflow:hidden}
  body{width:700px;padding:24px;font-family:var(--font-ui);color:var(--fg-primary)}
  .row{display:flex;gap:12px;align-items:stretch}
  .col{display:flex;flex-direction:column;gap:8px;flex:1}
  .lbl{font:500 11px/1 var(--font-ui);color:var(--fg-muted);letter-spacing:.04em;text-transform:uppercase}
  .hex{font:500 11px/1 var(--font-data);color:var(--fg-muted);font-variant-numeric:tabular-nums}
  .name{font:500 13px/1 var(--font-ui);color:var(--fg-primary)}
  .swatch{height:64px;border-radius:6px;border:1px solid rgba(255,255,255,.04)}
  .chip{display:flex;flex-direction:column;gap:6px;flex:1}
  .meta{display:flex;justify-content:space-between;align-items:baseline}
  .grid-bg{background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:8px 8px}
</style>
</head>
<body>
<div style="display:flex;gap:16px;align-items:center">
  <div style="flex:1;background:var(--bg-card);border:1px solid var(--border-default);border-radius:8px;padding:8px;display:flex;align-items:center;justify-content:center;height:140px">
    <img src="../assets/logo-banner.png" style="max-height:120px;max-width:100%;object-fit:contain">
  </div>
  <div style="width:140px;background:var(--bg-card);border:1px solid var(--border-default);border-radius:8px;padding:8px;display:flex;align-items:center;justify-content:center;height:140px">
    <img src="../assets/logo-square.png" style="max-height:120px;max-width:100%;object-fit:contain">
  </div>
</div>
<div style="margin-top:10px;font:400 11px/1.4 var(--font-ui);color:var(--status-critical)"><strong style="color:var(--status-critical)">Flagged for replacement.</strong> Current marks are AI-generated (visible artifacts: rainbow streak across the flame, awkward FTA letterforms). Treat as placeholder.</div></body></html>
