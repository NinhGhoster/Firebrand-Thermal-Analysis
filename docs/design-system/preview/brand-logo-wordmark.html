<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:var(--neutral-1000);margin:0;padding:0;overflow:hidden}
  body{width:700px;padding:24px;font-family:var(--font-ui);color:var(--fg-primary)}
  .row{display:flex;gap:12px;align-items:stretch}
  .col{display:flex;flex-direction:column;gap:8px;flex:1}
  .lbl{font:500 11px/1 var(--font-ui);color:var(--fg-muted);letter-spacing:.04em;text-transform:uppercase}
  .hex{font:500 11px/1 var(--font-data);color:var(--fg-muted);font-variant-numeric:tabular-nums}
  .name{font:500 13px/1 var(--font-ui);color:var(--fg-primary)}
  .swatch{height:64px;border-radius:6px;border:1px solid rgba(255,255,255,.04)}
  .chip{display:flex;flex-direction:column;gap:6px;flex:1}
  .meta{display:flex;justify-content:space-between;align-items:baseline}
  .grid-bg{background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:8px 8px}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:14px">
  <div style="background:var(--bg-card);border:1px solid var(--border-default);border-radius:8px;padding:24px;display:flex;align-items:center;gap:14px">
    <div style="width:36px;height:36px;border-radius:8px;background:var(--gradient-inferno);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)"></div>
    <div style="display:flex;flex-direction:column;line-height:1">
      <div style="font:700 22px/1 var(--font-ui);color:var(--fg-primary);letter-spacing:-.01em">Firebrand</div>
      <div style="font:500 11px/1 var(--font-data);color:var(--fg-muted);margin-top:5px;letter-spacing:.12em;text-transform:uppercase">Thermal Analysis</div>
    </div>
  </div>
  <div style="background:var(--neutral-100);border-radius:8px;padding:24px;display:flex;align-items:center;gap:14px">
    <div style="width:36px;height:36px;border-radius:8px;background:var(--gradient-inferno);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)"></div>
    <div style="display:flex;flex-direction:column;line-height:1">
      <div style="font:700 22px/1 var(--font-ui);color:#0B0D10;letter-spacing:-.01em">Firebrand</div>
      <div style="font:500 11px/1 var(--font-data);color:#5A6170;margin-top:5px;letter-spacing:.12em;text-transform:uppercase">Thermal Analysis</div>
    </div>
  </div>
</div>
<div style="margin-top:10px;font:400 11px var(--font-ui);color:var(--fg-muted)">Proposed wordmark — Fira Sans 700, inferno-gradient square as mark. Built from type only; ships in light + dark.</div></body></html>
