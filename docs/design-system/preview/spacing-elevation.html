<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{background:var(--neutral-1000);margin:0;padding:0;overflow:hidden}
  body{width:700px;padding:24px;font-family:var(--font-ui);color:var(--fg-primary)}
  .row{display:flex;gap:12px;align-items:stretch}
  .col{display:flex;flex-direction:column;gap:8px;flex:1}
  .lbl{font:500 11px/1 var(--font-ui);color:var(--fg-muted);letter-spacing:.04em;text-transform:uppercase}
  .hex{font:500 11px/1 var(--font-data);color:var(--fg-muted);font-variant-numeric:tabular-nums}
  .name{font:500 13px/1 var(--font-ui);color:var(--fg-primary)}
  .swatch{height:64px;border-radius:6px;border:1px solid rgba(255,255,255,.04)}
  .chip{display:flex;flex-direction:column;gap:6px;flex:1}
  .meta{display:flex;justify-content:space-between;align-items:baseline}
  .grid-bg{background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:8px 8px}
</style>
</head>
<body>
<div style="display:flex;gap:14px">

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px">
    <div style="width:88px;height:60px;border-radius:8px;background:var(--bg-card);border:0"></div>
    <div style="text-align:center">
      <div style="font:500 11px/1 var(--font-data);color:var(--fg-primary)">--elev-0</div>
      <div style="font:400 10px/1.3 var(--font-ui);color:var(--fg-muted);margin-top:4px">hairline · none</div>
    </div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px">
    <div style="width:88px;height:60px;border-radius:8px;background:var(--bg-card);box-shadow:inset 0 0 0 1px var(--neutral-700)"></div>
    <div style="text-align:center">
      <div style="font:500 11px/1 var(--font-data);color:var(--fg-primary)">--elev-1</div>
      <div style="font:400 10px/1.3 var(--font-ui);color:var(--fg-muted);margin-top:4px">default hairline</div>
    </div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px">
    <div style="width:88px;height:60px;border-radius:8px;background:var(--bg-card);box-shadow:inset 0 0 0 1px var(--neutral-600)"></div>
    <div style="text-align:center">
      <div style="font:500 11px/1 var(--font-data);color:var(--fg-primary)">--elev-2</div>
      <div style="font:400 10px/1.3 var(--font-ui);color:var(--fg-muted);margin-top:4px">strong hairline</div>
    </div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px">
    <div style="width:88px;height:60px;border-radius:8px;background:var(--bg-card);box-shadow:0 0 0 2px var(--bg-app),0 0 0 4px var(--ember-500)"></div>
    <div style="text-align:center">
      <div style="font:500 11px/1 var(--font-data);color:var(--fg-primary)">--elev-focus</div>
      <div style="font:400 10px/1.3 var(--font-ui);color:var(--fg-muted);margin-top:4px">focus ring</div>
    </div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px">
    <div style="width:88px;height:60px;border-radius:8px;background:var(--bg-card);box-shadow:0 12px 32px -8px rgba(0,0,0,.6),0 4px 12px -4px rgba(0,0,0,.4)"></div>
    <div style="text-align:center">
      <div style="font:500 11px/1 var(--font-data);color:var(--fg-primary)">--popover</div>
      <div style="font:400 10px/1.3 var(--font-ui);color:var(--fg-muted);margin-top:4px">reserved · modals</div>
    </div>
  </div>
</div></body></html>
